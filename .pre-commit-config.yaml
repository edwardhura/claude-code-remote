# Pre-commit hooks for claude-code-remote.
# Install: `uv run pre-commit install` (after `uv sync --group dev`).
# Run on the full repo: `uv run pre-commit run --all-files`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--strict]
        files: ^src/ccr/
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - sqlalchemy>=2.0
          - structlog>=24.4
